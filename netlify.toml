[build]
  publish = "frontend"
  command = ""
  # Skip the build unless a served file changed. If Netlify has no earlier commit to compare with
  # (first build, or that commit is not in the clone), build anyway instead of cancelling.
  ignore = "git cat-file -e $CACHED_COMMIT_REF 2>/dev/null && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- frontend netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# config.js holds the auto-updated tunnel URL — must never be cached.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
